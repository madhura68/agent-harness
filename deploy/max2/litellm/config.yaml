# LiteLLM config for the M45-2d harness worker on max2 (production). Keys only as os.environ/...: the values come from
# the compose env file (/etc/agent-harness/litellm.env by default), never from this repo. No database, no callbacks.
# The model_name values are exactly the configuration names in harness.json (a test pins that).
model_list:
  # Local: max2's Ollama, reached through litellm-ollama-bridge.service on the litellm network's gateway.
  - model_name: gsq-lokaal
    litellm_params:
      model: openai/qwen3.8-gsq-rco:27b-iq3_s-text
      api_base: http://172.30.82.1:11434/v1
      api_key: "none"
      timeout: 600
  # Hosted: OpenRouter at BF16, no data collection, no silent fallback. extra_body is merged into every request
  # of this deployment. The trial of increment 1 measured that the provider block reaches OpenRouter (docs/runbooks/litellm-max2.md).
  - model_name: qwen3.8-or
    litellm_params: &qwen38or-params
      model: openrouter/qwen/qwen3.8-27b
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 600
      extra_body:
        provider:
          quantizations: ["bf16"]
          data_collection: "deny"
          require_parameters: true
          allow_fallbacks: false
    # ISS-5: LiteLLM 1.83.3 allows reasoning_effort for OpenRouter only when its model cost map marks the model as
    # reasoning-capable. That map is fetched live from GitHub at every container start, and on 2026-10-09 LiteLLM removed
    # every openrouter/* row from it (PRs #45665-#45669), so the harness's reasoningEffort got HTTP 400. This registers the
    # capability for this deployment itself (router registers model_info under openrouter/qwen/qwen3.8-27b), independent
    # of that map. The cost per answer still comes from OpenRouter's usage.cost in the body, not from the map.
    model_info: &qwen38or-info
      supports_reasoning: true
  # Context-window trial (2026-10-18): the same OpenRouter deployment under three more names, so harness.json can give each
  # its own contextTokens (the model itself takes 1M). The harness, not the provider, enforces the window: it stubs the
  # oldest tool results and stops with CONTEXT_EXHAUSTED when even that does not fit. Only the name differs per entry.
  - model_name: qwen3.8-or-16k
    litellm_params: *qwen38or-params
    model_info: *qwen38or-info
  - model_name: qwen3.8-or-32k
    litellm_params: *qwen38or-params
    model_info: *qwen38or-info
  - model_name: qwen3.8-or-128k
    litellm_params: *qwen38or-params
    model_info: *qwen38or-info
  # Model comparison (2026-10-18): four more OpenRouter models. None of them has a BF16 endpoint, so these pin FP8 (JP's
  # choice): near the original quality, unlike fp4/int4, and "unknown" is excluded so a measurement says what it ran on. Each
  # model has 8-16 FP8 endpoints with tools, so a fallback to the next endpoint is allowed here (the BF16 pin above has one
  # endpoint and no fallback). sort: price takes the cheapest endpoint that passes the filters; max_price (USD per million
  # tokens) keeps an expensive endpoint out. supports_reasoning: true for the same reason as ISS-5 above.
  # Reasoning effort differs per model, because OpenRouter's model metadata (reasoning.supported_efforts, 2026-10-18) does:
  # DeepSeek V4 takes xhigh/high/none and GLM-5.3 max/high/low (reasoning mandatory), so harness.json sets "high" for both,
  # the nearest to qwen3.8-or's "medium" that they accept; MiniMax-M3 offers no effort choice, so harness.json sets none.
  - model_name: deepseek-v4-flash-or
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 600
      extra_body: &or-fp8-extra
        provider:
          quantizations: ["fp8"]
          data_collection: "deny"
          require_parameters: true
          allow_fallbacks: true
          sort: "price"
          max_price:
            prompt: 2
            completion: 5
    model_info: &or-reasoning-info
      supports_reasoning: true
  - model_name: deepseek-v4-pro-or
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 600
      extra_body: *or-fp8-extra
    model_info: *or-reasoning-info
  - model_name: glm-5.3-or
    litellm_params:
      model: openrouter/z-ai/glm-5.3
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 600
      extra_body: *or-fp8-extra
    model_info: *or-reasoning-info
  - model_name: minimax-m3-or
    litellm_params:
      model: openrouter/minimax/minimax-m3
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 600
      extra_body: *or-fp8-extra
    model_info: *or-reasoning-info

litellm_settings:
  turn_off_message_logging: true

router_settings:
  # One deployment per model and no fallbacks, so a cooldown has nothing to route around: after an upstream error it would
  # only answer the next requests for 5 s with LiteLLM's own 429 ("No deployments available"). That hides real upstream
  # answers from the harness. Seen on 1.83.3.
  disable_cooldowns: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
