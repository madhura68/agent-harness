# LiteLLM for the M45 trial on max2 (increment 1): runs only during the trial window, listens only on loopback.
# Every compose call needs LITELLM_ENV_FILE, `down` included:
#   LITELLM_ENV_FILE=/run/user/1000/m45.env docker compose -f deploy/max2/litellm/compose.yml up -d
# That file holds OPENROUTER_API_KEY and LITELLM_MASTER_KEY; it never lives in this repo.
name: litellm

services:
  litellm:
    # v1.83.3-stable, the same digest as Scrum4Us (infra/compose/docker-compose.srv.yml:58). A single OCI image
    # manifest (not an index), so the digest names exactly one image (linux/amd64). LiteLLM is the only pinned part:
    # it holds the provider keys.
    image: ghcr.io/berriai/litellm@sha256:c2b7aba0e3ebac7618ed23d12c5c65e05c533fb6843a0c694ff5c77c53de3ddf
    # Plain `litellm`: the harness worker removes containers that carry its own name prefix (M45 plan, constraint 7).
    container_name: litellm
    restart: "no"
    env_file: ${LITELLM_ENV_FILE:?set LITELLM_ENV_FILE to the env file with the keys}
    command: ["--config", "/opt/litellm/config.yaml", "--port", "4000"]
    volumes:
      - ./config.yaml:/opt/litellm/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    networks: [litellm]
    mem_limit: 2g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # python, not curl: the image is python-based. /health/liveliness needs no key.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  litellm:
    # An explicit name, so `docker network rm litellm` and a filter on ^litellm$ hit this network.
    name: litellm
    # Not internal: qwen3.8-or needs egress to OpenRouter. The gateway is where litellm-ollama-bridge.service
    # forwards the host's Ollama.
    driver_opts:
      com.docker.network.bridge.name: br-litellm
    ipam:
      config:
        - subnet: 172.30.82.0/24
          gateway: 172.30.82.1
